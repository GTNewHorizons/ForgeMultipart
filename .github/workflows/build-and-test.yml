
name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    secrets: inherit

  forge-functional-tests:
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept the Minecraft EULA
        run: |
          mkdir -p run/server
          echo "eula=true" > run/eula.txt
          echo "eula=true" > run/server/eula.txt

      - name: Run Forge functional tests
        run: ./gradlew --build-cache --stacktrace runFunctionalTestServer

      # The server runs out of process; without this a failure leaves only the counts.
      - name: Upload functional test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-functional-test-reports
          path: |
            run/server/junit-out/
            run/server/logs/
            run/server/crash-reports/
          if-no-files-found: warn
          retention-days: 14
